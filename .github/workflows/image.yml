name: Build, test and publish
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - name: Require a native x86-64 runner
        run: test "$(uname -m)" = x86_64
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check shell syntax and configuration
        run: |
          bash -n container/*.sh tests/*.sh deploy/system/remote-firefox-build
          node --test tests/clipboard.test.cjs
          python3 -m json.tool renovate.json >/dev/null
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build fresh packages
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          pull: true
          no-cache: true
          tags: remote-firefox:test
      - name: Smoke test
        run: bash tests/smoke.sh remote-firefox:test
      - name: Image metadata
        id: meta
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "image=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Registry login
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          docker tag remote-firefox:test "$IMAGE:latest"
          docker tag remote-firefox:test "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:sha-$GITHUB_SHA"
